<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Tense Bingo (-ed)</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #00838f;
            margin-bottom: 10px;
        }
        .rule-box {
            background-color: #fff9c4;
            border: 3px dashed #fbc02d;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            color: #d35400;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .rule-example {
            font-size: 20px;
            color: #c0392b;
            margin-top: 10px;
        }
        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 200px;
        }
        .word-display {
            font-size: 32px;
            font-weight: bold;
            color: #2980b9;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            background: #ecf0f1;
        }
        button.draw-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            transition: 0.1s;
        }
        button.draw-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #27ae60;
        }
        button.draw-btn:disabled {
            background-color: #95a5a6;
            box-shadow: 0 4px #7f8c8d;
            cursor: not-allowed;
        }
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            background-color: #34495e;
            padding: 10px;
            border-radius: 15px;
        }
        .bingo-cell {
            background-color: white;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 4px rgba(0,0,0,0.1);
        }
        .bingo-cell:hover {
            background-color: #f1c40f;
        }
        .bingo-cell.stamped {
            background-color: #ff7675;
            color: white;
            text-decoration: line-through;
            pointer-events: none;
            box-shadow: inset 0 3px rgba(0,0,0,0.2);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        .modal-content button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Team Bingo: Yesterday Words!</h1>
    
    <!-- A. 규칙 설명 영역 -->
    <div class="rule-box">
        과거 = 동사 + -ed
        <div class="rule-example">walk &rarr; walked &nbsp;&nbsp;|&nbsp;&nbsp; play &rarr; played</div>
    </div>

    <div class="game-container">
        <!-- 교사 조작 패널 (현재형 단어 제시) -->
        <div class="control-panel">
            <h3>Teacher's Card</h3>
            <div id="wordDisplay" class="word-display">Ready?</div>
            <button id="drawBtn" class="draw-btn" onclick="drawWord()">단어 뽑기</button>
            <p style="font-size: 14px; color: #7f8c8d; margin-top: 20px;">
                뽑힌 단어의 <b>-ed 과거형</b>을<br>빙고판에서 찾으세요!
            </p>
        </div>

        <!-- 학생 빙고판 (-ed 형태) -->
        <div id="bingoBoard" class="bingo-board">
            <!-- JavaScript로 셀 생성 -->
        </div>
    </div>

    <!-- C. 메타언어적 피드백 모달 -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <div id="feedbackText">과거를 말할 땐 -ed가 필요합니다!</div>
            <button onclick="closeModal()">다시 해보기</button>
        </div>
    </div>

    <script>
        // 목표 어휘 (규칙 동사)
        const wordPairs = [
            { base: "walk", past: "walked" },
            { base: "play", past: "played" },
            { base: "jump", past: "jumped" },
            { base: "look", past: "looked" },
            { base: "wash", past: "washed" },
            { base: "cook", past: "cooked" },
            { base: "clean", past: "cleaned" },
            { base: "watch", past: "watched" },
            { base: "brush", past: "brushed" }
        ];

        let currentTargetPast = "";
        let drawnWords = [];
        let boardWords = [];
        let gridState = [
            [false, false, false],
            [false, false, false],
            [false, false, false]
        ];

        // 배열 섞기 함수
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 빙고판 초기화
        function initBingo() {
            const board = document.getElementById("bingoBoard");
            board.innerHTML = "";
            gridState = [[false, false, false], [false, false, false], [false, false, false]];
            drawnWords = [];
            currentTargetPast = "";
            document.getElementById("wordDisplay").textContent = "Ready?";
            document.getElementById("drawBtn").disabled = false;

            // 과거형 단어들로 빙고판 채우기
            let pastWords = wordPairs.map(pair => pair.past);
            boardWords = shuffle([...pastWords]);

            boardWords.forEach((word, index) => {
                const cell = document.createElement("button");
                cell.className = "bingo-cell";
                cell.textContent = word;
                cell.onclick = () => handleCellClick(cell, word, index);
                board.appendChild(cell);
            });
        }

        // 단어 뽑기
        function drawWord() {
            let remainingPairs = wordPairs.filter(pair => !drawnWords.includes(pair.base));
            
            if (remainingPairs.length === 0) {
                document.getElementById("wordDisplay").textContent = "End!";
                document.getElementById("drawBtn").disabled = true;
                return;
            }

            // 무작위로 하나 뽑기
            let randomPair = remainingPairs[Math.floor(Math.random() * remainingPairs.length)];
            drawnWords.push(randomPair.base);
            currentTargetPast = randomPair.past;

            document.getElementById("wordDisplay").textContent = randomPair.base;
        }

        // 빙고 셀 클릭 이벤트
        function handleCellClick(cell, selectedWord, index) {
            if (!currentTargetPast) return; // 아직 단어를 안 뽑았을 때

            if (selectedWord === currentTargetPast) {
                // 정답: 셀 스탬프 처리
                cell.classList.add("stamped");
                let row = Math.floor(index / 3);
                let col = index % 3;
                gridState[row][col] = true;
                
                // 정답을 맞추면 다음 단어를 위해 타겟 초기화
                currentTargetPast = "";
                document.getElementById("wordDisplay").textContent = "Good Job!";
                
                setTimeout(checkBingo, 300);
            } else {
                // 오답: C. 메타언어적 피드백 제공
                showModal();
            }
        }

        function showModal() {
            document.getElementById("feedbackModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("feedbackModal").style.display = "none";
        }

        // 빙고 완성 확인
        function checkBingo() {
            let bingoCount = 0;
            
            // 가로 확인
            for (let i = 0; i < 3; i++) {
                if (gridState[i][0] && gridState[i][1] && gridState[i][2]) bingoCount++;
            }
            // 세로 확인
            for (let j = 0; j < 3; j++) {
                if (gridState[0][j] && gridState[1][j] && gridState[2][j]) bingoCount++;
            }
            // 대각선 확인
            if (gridState[0][0] && gridState[1][1] && gridState[2][2]) bingoCount++;
            if (gridState[0][2] && gridState[1][1] && gridState[2][0]) bingoCount++;

            if (bingoCount >= 1) {
                setTimeout(() => {
                    alert("🎉 BINGO! 빙고를 완성했어요! 🎉");
                    initBingo();
                }, 300);
            }
        }

        // 페이지 로드 시 게임 초기화
        window.onload = initBingo;
    </script>
</body>
</html>
